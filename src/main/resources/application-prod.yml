spring:
  application:
    name: speakview
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/speakview
    username: speakview
    password: ${RDS_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: false
aws:
  s3:
    region: ap-northeast-2
    bucket: your-bucket-name
    key-prefix: audio
    cloudfront-domain: ""