spring:
  application:
    name: speakview
  profiles:
    active: local
    group:
      local: local
      prod: prod
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  upload-dir: uploads/timetable

soniox:
  api-key: ${SONIOX_API_KEY}

openapi:
  api-key: ${GPT_API_KEY}
  model: gpt-4o-mini

gemini:
  api-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent
  api-key: ${GEMINI_API_KEY}

aws:
  s3:
    region: ap-northeast-2
    bucket: your-bucket-name
    key-prefix: audio
    cloudfront-domain: ""